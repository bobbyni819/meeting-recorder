[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultlab-meetings"
version = "0.1.0"
description = "Smart Windows meeting recorder with per-app audio capture, voice-activity detection, and local/cloud transcription. Used by vaultlab as the meeting-context layer."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Bobby Y.X. Ni"},
]
keywords = [
    "meeting-recorder", "transcription", "whisper", "audio-capture",
    "vad", "per-app-audio", "vaultlab", "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
]
dependencies = [
    "proc-tap>=0.3.0",
    "PyAudioWPatch>=0.2.12",
    "pystray>=0.19",
    "Pillow>=10.0",
    "winotify>=1.1",
    "psutil>=5.9",
    "numpy>=1.24",
    "pydub>=0.25",
    "tomli>=2.0;python_version<'3.11'",
    "tomli-w>=1.0",
    "keyboard>=0.13",
    "mss>=9.0",
    "opencv-python>=4.8",
    "pycaw>=20230407",
    # resampling.py imports scipy unconditionally; previously arrived only
    # transitively via the [local] extra's pyannote chain.
    "scipy>=1.10",
]

[project.optional-dependencies]
local = [
    "faster-whisper>=1.0",
    "torch>=2.1",
    "pyannote.audio>=3.1,<4.0",
]
cloud = [
    "openai>=1.0",
]
outlook = [
    "pywin32>=306",
]
gdrive = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
]
summary-openai = [
    "openai>=1.0",
]
summary-anthropic = [
    "anthropic>=0.18",
]
gemini = [
    "google-genai>=1.0",
]
# Bundled ffmpeg binary for the decoupled video encoder (h264_nvenc/libx264);
# screen recording falls back to cv2.VideoWriter without it.
video-encode = [
    "imageio-ffmpeg>=0.5",
]
# UIAutomation-based Zoom/Teams mute-state detection; mute sync falls back
# to the keyboard-hook + registry paths without it.
uia = [
    "uiautomation>=2.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
e2e = [
    "sounddevice>=0.4",
    "soundfile>=0.12",
    "playwright>=1.40",
    "pyttsx3>=2.90",
]

[project.urls]
Homepage = "https://github.com/bobbyni819/meeting-recorder"
Source = "https://github.com/bobbyni819/meeting-recorder"
Issues = "https://github.com/bobbyni819/meeting-recorder/issues"

[project.scripts]
meeting-recorder = "meeting_recorder.__main__:main"

[tool.setuptools.packages.find]
include = ["meeting_recorder*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring VB-Cable and meeting app",
]
