[recording]
output_dir = "~/MeetingRecordings"
language = "en"
user_name = "User"
live_transcription = true  # real-time transcription preview during recording
live_transcript_mic = true  # also feed your mic into the live preview (labelled [You])
live_model_size = "large-v3-turbo"  # live-preview Whisper model ("" = tier default: small). Verified on the RTX 5060: ~33x real-time, near-final accuracy. Options: tiny/base/small/medium/distil-large-v3/large-v3-turbo
auto_start = false  # auto-detect Zoom/Teams/Webex meetings and start recording
auto_retry_failed = true  # heal failed/stuck recordings at startup (cheap tail steps: missing summary/upload)
auto_retry_full_reprocess = false  # auto RE-TRANSCRIBE failed recordings at startup — off to protect free-tier API quota (reprocess manually instead)
start_muted = true  # start every recording with the mic muted (you usually join muted); auto-detection unmutes within ~1.5s if you're actually unmuted
mute_privacy_first = true  # only record mic when positively confirmed unmuted; re-mutes if the meeting mute button becomes unreadable (toolbar hidden) — never records the room behind your back
mute_remute_seconds = 12.0  # how long the mute button can stay unreadable while unmuted before privacy-first re-mutes
smart_rename = true  # rename the folder from transcript content (disambiguates same-slot meetings via calendar); only the folder moves, files inside are untouched
capture_speaker_events = false  # EXPERIMENTAL: poll Zoom/Teams UI for active speaker to name diarized speakers (needs live-meeting validation; writes additive speaker_events.jsonl)
echo_gate = false  # drop mic frames that are just the meeting audio echoing through your speakers (uses the loopback as reference). Stops other participants bleeding into the mic track. Only affects speaker (non-headphone) users; never drops your own speech. Off pending live validation.

[audio]
sample_rate = 16000
channels = 1
chunk_duration_ms = 30
mic_device = ""  # empty = system default

[vad]
threshold = 0.5
min_speech_duration_ms = 250
min_silence_duration_ms = 300

[transcription]
backend = "gemini"  # "local", "cloud", or "gemini"
model_size = "large-v3"
device = "cuda"  # "cuda" or "cpu"
compute_type = "float16"
openai_api_key = ""
gemini_api_key = ""
gemini_model = "gemini-2.5-flash"  # empty = use default (gemini-2.5-flash)

[diarization]
enabled = true
huggingface_token = ""
min_speakers = 2
max_speakers = 6
model = "pyannote/speaker-diarization-community-1"  # newer/more accurate; auto-falls back to 3.1 if not accepted on HF

[output]
formats = ["json", "txt", "srt"]

[hotkey]
toggle_recording = "ctrl+shift+r"
toggle_pause = "ctrl+shift+p"  # pause/resume recording
toggle_mute = "ctrl+shift+u"  # manual mic mute toggle for recorder
toggle_dashboard = "ctrl+shift+d"  # show/hide recording dashboard

[screen_recording]
enabled = true
fps = 15.0  # frames per second; raise to 30/60 for smoother video, lower to save CPU/disk. Measured 2026-09-01: the grab loop only sustains ~10-20 fps on real meeting windows anyway (42-68% duplicate frames at 30fps), so 15 halves encoder/pipe load and file size with no visible content loss.
quality = 21  # video quality (CQ/CRF): LOWER = crisper text/slides, bigger file. 18 ~lossless, 21 high, 28 small. Resolution = the captured window's native size, so maximize the window for higher resolution.

[outlook]
enabled = true         # auto-detect meeting name from Outlook calendar
buffer_minutes = 10    # search window: current time ± N minutes
read_details = false   # read organizer/attendees/body too — these COM properties fire Outlook's "access email address information" security prompt (Trust Center is GPO-locked on Duke machines), so off = prompt-free subject/time/location only

[google_drive]
enabled = true         # upload recordings to Google Drive after transcription
credentials_path = "~/.config/google/client_secret.json"
folder_id = ""         # leave empty to auto-create "MeetingRecordings" folder
upload_audio = false   # also upload raw WAVs (~130 MB/meeting); off = transcripts/summaries/notes only (video never uploads)

[summary]
enabled = true         # generate AI summary after transcription
provider = "gemini"    # "openai", "anthropic", or "gemini"
api_key = ""
model = "gemini-2.5-flash"  # gemini-2.0-flash free tier was zeroed (429 limit: 0) — keep in sync with transcription model
max_transcript_tokens = 0  # 0 = no limit

[retention]
enabled = false        # auto-delete old recordings based on age/size
max_age_days = 90      # delete recordings older than N days (0 = no age limit)
max_total_gb = 0.0     # delete oldest when total exceeds N GB (0 = no size limit)

[dictation]
enabled = true                               # set true to enable the dictate subcommand
drive_root = "G:/My Drive/Knowledge"         # routed per project: <root>/<project>/Sources/voice-memos/<date>/
hotkey = "ctrl+shift+v"                      # toggle start/stop; uses transcription.gemini_api_key
project_list = ["metabolism", "dcp", "ailab", "tools", "career"]
default_project = "general"                  # fallback when Gemini can't infer a project
gemini_model = ""                            # empty = inherit transcription.gemini_model
project_subpath_template = "{project}/Sources/voice-memos"  # falls back to <root>/voice-memos/ if project folder missing

[dashboard]
enabled = true
auto_show = true       # auto-show dashboard when recording starts
auto_hide = true       # auto-hide dashboard when recording stops
opacity = 0.92
position = "top-right" # top-left, top-right, bottom-left, bottom-right, center
position_x = -1        # -1 = use position preset
position_y = -1
start_collapsed = false
show_transcript = true
show_screen_preview = true  # show live screen capture thumbnail in dashboard

[performance]
# Per-machine tier gating heavy features. LOCAL-ONLY: this value is written
# to ~/.meeting_recorder/secrets.toml, NOT synced via git, so each machine
# keeps its own setting. "auto" detects GPU/CPU/RAM at startup.
#   auto     — detect and pick (recommended)
#   light    — weak/no-GPU machine: live transcription off, small fallback model, cv2 video
#   balanced — capable GPU (e.g. RTX 3060): live on, medium fallback, NVENC video
#   full     — strong GPU (>=10GB) + many cores: everything on, large-v3 fallback
profile = "auto"
